<div class="podcast-card">
  <p class="bot-hint">AI-generated podcast episode discussing my skills & potential.</p>

  <audio
    id="podcast-audio"
    preload="auto"
    controlslist="nodownload noplaybackrate noremoteplayback"
    style="display:none"
  >
    <source src="{{ site.baseurl }}/assets/audio/episode1.m4a?v={{ site.time | date: '%s' }}" type="audio/mp4; codecs=mp4a.40.2">
    Your browser does not support the audio element.
  </audio>

  <!-- Play and Stop -->
  <div class="podcast-controls" style="display:flex; gap:10px; margin:10px 0;">
    <button id="btn-play" type="button" class="podcast-btn">▶ Play</button>
    <button id="btn-stop" type="button" class="podcast-btn">■ Stop</button>
  </div>
</div>

<script>
(() => {
  const audio = document.getElementById('podcast-audio');
  const btnPlay = document.getElementById('btn-play');
  const btnStop = document.getElementById('btn-stop');

  let allowProgrammaticSeek = false;
  const lock = {
    volume: 1.0,
    rate: 1.0,
  };
  audio.volume = lock.volume;
  audio.playbackRate = lock.rate;

  audio.addEventListener('seeking', () => {
    if (!allowProgrammaticSeek) {
      const t = audio.currentTime;
      audio.pause();
      setTimeout(() => { audio.currentTime = t; audio.play().catch(()=>{}); }, 0);
    }
  });

  audio.addEventListener('ratechange', () => {
    if (audio.playbackRate !== lock.rate) audio.playbackRate = lock.rate;
  });
  audio.addEventListener('volumechange', () => {
    if (audio.volume !== lock.volume) audio.volume = lock.volume;
    if (audio.muted) audio.muted = false;
  });

  // Play
  btnPlay?.addEventListener('click', async () => {
    try {
      if (audio.readyState < 2) audio.load?.();
      await audio.play();
    } catch (e) {
      console.warn('audio.play() failed:', e);
    }
  });

  // Stop
  btnStop?.addEventListener('click', () => {
    audio.pause();
    allowProgrammaticSeek = true;
    audio.currentTime = 0;
    allowProgrammaticSeek = false;
  });
})();
</script>
