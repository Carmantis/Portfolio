<!-- Electric Discharge Cursor (neon) -->
<canvas id="cursor-bolts" aria-hidden="true"
        style="position:fixed;inset:0;pointer-events:none;z-index:9999;mix-blend-mode:screen"></canvas>
<script>
(() => {
  // Skip on touch devices or reduced-motion preference
  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const isCoarse = window.matchMedia('(pointer: coarse)').matches;
  if (prefersReduced || isCoarse) return;

  const cvs = document.getElementById('cursor-bolts');
  const ctx = cvs.getContext('2d');

  // Colors: Neon green + optional cyan highlight
  const COLORS = [
    'hsl(120, 100%, 60%)',  // Neon green (#39ff14 style)
    'hsl(170, 100%, 65%)'   // Optional cyan/turquoise highlight
  ];
  const USE_SECOND_COLOR = true; // Set to false for only green

  let DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  let W = 0, H = 0;

  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    W = Math.floor(w * DPR); H = Math.floor(h * DPR);
    cvs.width = W; cvs.height = H;
    cvs.style.width = w + 'px'; cvs.style.height = h + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  }
  resize(); addEventListener('resize', resize);

  // Fetch all widget cards for interaction
  const widgets = document.querySelectorAll('.widget-card');

  class LightningBolt {
    constructor(x, y, targetRect = null) {
      this.startX = x; this.startY = y;
      this.targetRect = targetRect;  // Store target widget's bounding rect if provided
      this.branches = this._createBranches();
      this.life = Math.random() * 15 + 15;  // 15..30 frames
      this.alpha = 0.5;  // Base opacity
    }

    _createBranches() {
      const arr = [];
      const n = (Math.random() * 2 | 0) + 2;  // 2..3 branches

      // If there's a target, create a main branch towards the widget edge
      if (this.targetRect) {
        const targetPoint = this._getClosestEdgePoint(this.startX, this.startY, this.targetRect);
        const mainLen = this._distance(this.startX, this.startY, targetPoint.x, targetPoint.y) * 0.8;  // 80% to edge
        const mainAngle = Math.atan2(targetPoint.y - this.startY, targetPoint.x - this.startX);
        
        // Create wavy path to target edge
        const mainPts = this._wavy(this.startX, this.startY, mainAngle, mainLen);
        
        // After reaching edge, crawl along the edge for a short distance (e.g., 50-100px)
        const crawlLen = Math.random() * 50 + 50;
        const crawlDir = Math.random() < 0.5 ? 1 : -1;  // Random direction along edge
        const crawlPts = this._crawlAlongEdge(targetPoint, this.targetRect, crawlDir, crawlLen);
        
        // Combine main path + crawl path into one branch
        const combinedPts = [...mainPts, ...crawlPts.slice(1)];  // Avoid duplicating endpoint
        arr.push({ points: combinedPts, depth: 0, maxDepth: 2 });  // Allow more branching
      }

      // Add remaining random branches
      for (let i = arr.length; i < n; i++) {
        const angle = Math.random() * Math.PI * 2;
        const len = Math.random() * 20 + 20;  // 20..40px
        const pts = this._wavy(this.startX, this.startY, angle, len);
        arr.push({ points: pts, depth: 0, maxDepth: 1 });
      }
      return arr;
    }

    _getClosestEdgePoint(sx, sy, rect) {
      const cx = Math.max(rect.left, Math.min(sx, rect.right));
      const cy = Math.max(rect.top, Math.min(sy, rect.bottom));
      return { x: cx, y: cy };
    }

    _distance(x1, y1, x2, y2) {
      return Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);
    }

    _crawlAlongEdge(start, rect, direction, length) {
      const pts = [start];
      let cx = start.x, cy = start.y;
      const steps = 8;
      const seg = length / steps;

      // Determine which edge we're on and crawl accordingly
      const isHorizontal = (Math.abs(cy - rect.top) < 1 || Math.abs(cy - rect.bottom) < 1);
      const dx = isHorizontal ? seg * direction : 0;
      const dy = !isHorizontal ? seg * direction : 0;

      for (let i = 1; i <= steps; i++) {
        cx += dx + (Math.random() - 0.5) * 2;  // Reduced waviness for sharper path
        cy += dy + (Math.random() - 0.5) * 2;  // Reduced waviness for sharper path
        // Clamp to edge bounds to prevent overflow
        cx = Math.max(rect.left, Math.min(cx, rect.right));
        cy = Math.max(rect.top, Math.min(cy, rect.bottom));
        pts.push({ x: cx, y: cy });
      }
      return pts;
    }

    _wavy(x, y, angle, length) {
      const pts = [{ x, y }];
      let cx = x, cy = y;
      const steps = 8;
      for (let i = 1; i <= steps; i++) {
        const seg = length / steps;
        const nx = cx + Math.cos(angle) * seg + (Math.random() - 0.5) * 3;  // Reduced waviness for sharper path
        const ny = cy + Math.sin(angle) * seg + (Math.random() - 0.5) * 3;  // Reduced waviness for sharper path
        pts.push({ x: nx, y: ny });
        cx = nx; cy = ny;
      }
      return pts;
    }

    _branchOut(b) {
      if (b.depth < b.maxDepth && Math.random() > 0.6) {
        const last = b.points[b.points.length - 1];
        const angle = Math.random() * Math.PI * 2;
        const len = Math.random() * 15 + 10;
        const pts = this._wavy(last.x, last.y, angle, len);
        this.branches.push({ points: pts, depth: b.depth + 1, maxDepth: b.maxDepth });
      }
    }

    update() {
      this.life--;
      this.alpha = Math.max(0, (this.life / 15) * 0.5);
      for (const b of this.branches) this._branchOut(b);
    }

    draw() {
      // Outer glow (thinner, sharper)
      ctx.save();
      ctx.globalAlpha = this.alpha * 0.7;
      ctx.shadowBlur = 10;  // Reduced for sharper effect
      ctx.shadowColor = COLORS[0];
      ctx.strokeStyle = COLORS[0];
      ctx.lineWidth = 2.0;  // Thinner line
      ctx.beginPath();
      for (const br of this.branches) {
        ctx.moveTo(br.points[0].x, br.points[0].y);
        for (let i = 1; i < br.points.length; i++) ctx.lineTo(br.points[i].x, br.points[i].y);
      }
      ctx.stroke();
      ctx.restore();

      // Inner core (thinner, sharper) + optional second color
      ctx.save();
      ctx.globalAlpha = this.alpha;
      ctx.shadowBlur = 4;  // Reduced for sharper effect
      ctx.shadowColor = USE_SECOND_COLOR ? COLORS[1] : COLORS[0];
      ctx.strokeStyle = USE_SECOND_COLOR ? COLORS[1] : COLORS[0];
      ctx.lineWidth = 0.8;  // Thinner line
      ctx.beginPath();
      for (const br of this.branches) {
        ctx.moveTo(br.points[0].x, br.points[0].y);
        for (let i = 1; i < br.points.length; i++) ctx.lineTo(br.points[i].x, br.points[i].y);
      }
      ctx.stroke();
      ctx.restore();
    }
  }

  let bolts = [];
  let mouse = { x: 0, y: 0, moving: false };
  let lastBolt = 0;
  const MIN_INTERVAL = 50; // ms

  // Mouse input
  addEventListener('pointermove', e => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.moving = true; }, { passive: true });
  addEventListener('pointerdown', e => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.moving = true; }, { passive: true });

  function maybeCreateBolts(now) {
    if (mouse.moving && (now - lastBolt) >= MIN_INTERVAL) {
      let targetRect = null;
      if (Math.random() < 0.15) {  // 15% chance to target a widget
        let closest = null, minDist = Infinity;
        widgets.forEach(w => {
          const r = w.getBoundingClientRect();
          const dist = Math.min(
            Math.abs(mouse.x - r.left), Math.abs(mouse.x - r.right),
            Math.abs(mouse.y - r.top), Math.abs(mouse.y - r.bottom)
          );
          if (dist < minDist) { minDist = dist; closest = r; }
        });
        if (closest && minDist < 200) {  // Only if within 200px
          targetRect = closest;
          // Debug: Log when targeting a widget
          console.log('Targeting widget:', targetRect);
        }
      }
      bolts.push(new LightningBolt(mouse.x, mouse.y, targetRect));
      lastBolt = now;
    }
  }

  function loop(now) {
    // Fade out trail
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(0, 0, cvs.width / DPR, cvs.height / DPR);

    maybeCreateBolts(now);
    bolts = bolts.filter(b => b.life > 0);
    for (const b of bolts) { b.update(); b.draw(); }

    mouse.moving = false;
    requestAnimationFrame(loop);
  }

  // Initial canvas fill
  ctx.fillStyle = 'rgba(0,0,0,1)';
  ctx.fillRect(0, 0, cvs.width / DPR, cvs.height / DPR);
  requestAnimationFrame(loop);

  // Hide when tab is inactive
  document.addEventListener('visibilitychange', () => {
    cvs.style.opacity = document.hidden ? '0' : '1';
  }, { passive: true });
})();
</script>
